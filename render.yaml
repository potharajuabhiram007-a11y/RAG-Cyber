# Render blueprint: runs the RAG-Cyber backend as a free web service.
# Used by Render when you choose New > Blueprint and pick this repository.
# Step-by-step instructions: DEPLOY.md
services:
  - type: web
    name: cyberintellix-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # --- secrets: Render asks for these when the blueprint is created ---
      - key: NEO4J_URI            # neo4j+s://<instance>.databases.neo4j.io
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: LLM_API_KEY          # key of the hosted model API
        sync: false

      # --- hosted model through an OpenAI-compatible API (Groq) ---
      # Groq retired its Llama chat models for free accounts on 2026-08-16;
      # openai/gpt-oss-120b is the replacement Groq recommends.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      # --- data ---
      - key: NEO4J_DATABASE       # new Aura instances name the database after the instance id
        sync: false               # (the 8 characters before .databases.neo4j.io); older ones use "neo4j"
      - key: NVD_SYNC_START_DATE  # Aura Free holds 200,000 nodes: load recent CVEs only
        value: "2024-01-01"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: UPDATE_INTERVAL_HOURS
        value: "24"
      - key: NVD_UPDATE_INTERVAL_HOURS
        value: "2"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RUN_INITIAL_SYNC     # catch up on missed updates each time the service wakes
        value: "true"

      - key: CORS_ORIGINS
        value: https://cyberintellix.vercel.app
      - key: LOG_LEVEL
        value: INFO
