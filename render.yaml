# Render blueprint: runs the RAG-Cyber backend as a free web service.
# Used by Render when you choose New > Blueprint and pick this repository.
# Step-by-step instructions: DEPLOY.md
services:
  - type: web
    name: cyberintellix-api
    runtime: python
    plan: free
    # Install, then download the embedding model during the build so a cold start
    # does not have to fetch it.
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      python -c "from backend.updater.st_onnx import OnnxSentenceEncoder;
      OnnxSentenceEncoder('sentence-transformers/all-MiniLM-L6-v2')"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # --- secrets: Render asks for these when the blueprint is created ---
      - key: NEO4J_URI            # neo4j+s://<instance>.databases.neo4j.io
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE       # newer Aura instances name it after the instance id
        sync: false
      - key: LLM_API_KEY          # key of the hosted model API
        sync: false

      # --- hosted model through an OpenAI-compatible API (Groq) ---
      # Groq retired its Llama chat models for free accounts on 2026-08-16;
      # openai/gpt-oss-120b is the replacement Groq recommends.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      # --- data ---
      # Aura Free holds 200,000 nodes and 1 GB. NVD now publishes ~100,000 CVEs a year,
      # so keep only the newest 150,000 (older ones are deleted as new ones arrive);
      # about 153,000 nodes and 165,000 relationships in total.
      - key: MAX_CVES
        value: "150000"
      - key: NVD_SYNC_START_DATE  # only used if the database is loaded without copy-to
        value: "2025-01-01"
      - key: EMBEDDING_PROVIDER
        value: sentence-transformers
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_RUNTIME    # ONNX: ~280 MB in total, fits the 512 MB free instance
        value: onnx
      - key: HF_HOME              # model cache inside the project folder, kept from the build
        value: /opt/render/project/src/.hf-cache
      - key: OMP_NUM_THREADS      # the free instance has a fraction of one CPU
        value: "1"
      - key: UPDATE_INTERVAL_HOURS        # CWE, CAPEC, ATT&CK: about every 3 months
        value: "2160"
      - key: NVD_UPDATE_INTERVAL_HOURS    # CVE (NVD): every 24 hours
        value: "24"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RUN_INITIAL_SYNC     # catch up on missed updates each time the service wakes
        value: "true"

      - key: CORS_ORIGINS
        value: https://cyberintellix.vercel.app
      - key: LOG_LEVEL
        value: INFO
