# Neo4j + the CyberIntelliX backend/website on one machine (a server, or a PC with
# Docker). Settings come from .env (copy .env.example); NEO4J_PASSWORD is required and
# becomes the password of the new Neo4j container.
#
#   docker compose up -d --build        then open http://localhost:8000
#   docker compose logs -f backend
#   docker compose down                 (the data stays in the neo4j-data volume)
#
# The first start loads MITRE data and CVEs from NVD, which takes a while. To load a
# smaller set, set MAX_CVES and NVD_SYNC_START_DATE in .env (see DEPLOY.md).
#
# LLM: with LLM_PROVIDER=ollama and Ollama on the host machine, set
#   LLM_BASE_URL=http://host.docker.internal:11434
# or use a hosted API (LLM_PROVIDER=openai with Groq, see render.yaml).

services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser, local access only
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_DATABASE: neo4j
      PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
